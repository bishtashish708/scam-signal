name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, no network)
        run: python -m unittest discover -s tests -v
      - name: Eval (rule engine)
        run: python evals/run_eval.py evals/dev.jsonl evals/heldout.jsonl evals/stress.jsonl
      - name: Build skill zip
        run: python scripts/build_skill_zip.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
